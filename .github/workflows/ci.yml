name: CI

# The factory's own repo should be agent-ready before it dispatches anything.
# Everything here is a wall, not a suggestion: an agent under context pressure
# may skip a SKILL.md instruction, but it cannot skip a required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the package declares; 3.13 is what the prior session
        # used. Both must stay green or the floor is a lie.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest

      - name: Boundary test — adversarial suite (visible partition)
        # The held-out partition is deliberately NOT run here. Running it every
        # commit would turn each red build into a tuning signal and burn the
        # partition, which is the exact offence the harness exists to catch.
        # See src/expfactory/selfcheck.py.
        run: python -m expfactory.selfcheck
