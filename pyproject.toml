[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expfactory"
version = "0.1.0"
description = "A software factory for empirical work: append-only ledger plus anti-fooling gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The verifier core deliberately has no runtime deps. numpy/scipy/scikit-learn are
# needed only by the demo workload, never by the gates or the ledger.
demo = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath lets the suite run straight from a clone with no editable install;
# an installed copy still takes precedence.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
warn_return_any = true
