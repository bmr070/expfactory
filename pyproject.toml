[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expfactory"
version = "0.1.0"
description = "A software factory for empirical work: append-only ledger plus anti-fooling gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The verifier core deliberately has no runtime deps. numpy/scipy/scikit-learn are
# needed only by the demo workload, never by the gates or the ledger.
demo = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]
# H3 onward: a pretrained audio encoder distilled to an edge student. Its own
# extra rather than folded into `demo`, because `demo` is what CI installs to run
# H1/H2 and torch is ~2.5 GB of wheel that neither needs — H1/H2 are scikit-learn
# over a cached feature matrix, which is why they finish in seconds.
#
# NOT a runtime dependency, and `tests/test_core_has_no_runtime_dependencies.py`
# is what keeps it that way: no adjudicating module may import it. A gate that
# needed torch would mean the verification layer had grown a reason to care what
# the task is, which is the coupling the plugin boundary exists to prevent.
#
# No upper bound on purpose: the CUDA build must match the installed driver
# (610.88, compute capability 8.9 on this machine), so which wheel index to use
# is a local install decision rather than something to freeze here. See
# docs/decisions/C-01-RESOLVED-local-gpu-first.md for the 12 GB ceiling.
h3 = ["torch>=2.4", "torchaudio>=2.4", "transformers>=4.44", "soundfile>=0.12"]
# Pinned, not floated. These three ARE the checks: an unpinned linter means a
# green local run says nothing about CI, and a new release can turn main red
# with no code change. Bump deliberately, in its own commit.
dev = ["pytest==8.4.2", "ruff==0.16.0", "mypy==1.20.2", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath lets the suite run straight from a clone with no editable install;
# an installed copy still takes precedence.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
# CLAUDE.md and README both claim "strict". The code already passed --strict, but
# nothing enforced it, so the claim was one careless commit from becoming false.
strict = true
